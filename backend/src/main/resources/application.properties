spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=${PORT:${SERVER_PORT:8081}}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.public-api.key-pepper=${PUBLIC_API_KEY_PEPPER}

# Outbound webhooks
app.webhooks.secret-encryption-keys=${WEBHOOK_SECRET_ENCRYPTION_KEYS}
app.webhooks.current-key-version=${WEBHOOK_SECRET_ENCRYPTION_KEY_VERSION:v1}
app.webhooks.allow-local-http=${WEBHOOK_ALLOW_LOCAL_HTTP:false}
app.webhooks.worker.enabled=${WEBHOOK_WORKER_ENABLED:true}
app.webhooks.worker.batch-size=${WEBHOOK_WORKER_BATCH_SIZE:10}
app.webhooks.worker.poll-interval-ms=${WEBHOOK_WORKER_POLL_INTERVAL_MS:1000}
app.webhooks.worker.initial-delay-ms=${WEBHOOK_WORKER_INITIAL_DELAY_MS:5000}
app.webhooks.worker.stale-claim-seconds=${WEBHOOK_STALE_CLAIM_SECONDS:120}
app.webhooks.worker.event-maximum-attempts=${WEBHOOK_EVENT_MAXIMUM_ATTEMPTS:5}
app.webhooks.worker.failed-subscription-threshold=${WEBHOOK_FAILED_SUBSCRIPTION_THRESHOLD:10}

# Workflow automation worker
app.workflows.worker.enabled=${WORKFLOW_WORKER_ENABLED:true}
app.workflows.worker.batch-size=${WORKFLOW_WORKER_BATCH_SIZE:10}
app.workflows.worker.poll-interval-ms=${WORKFLOW_WORKER_POLL_INTERVAL_MS:1000}
app.workflows.worker.initial-delay-ms=${WORKFLOW_WORKER_INITIAL_DELAY_MS:5000}
app.workflows.worker.stale-claim-seconds=${WORKFLOW_STALE_CLAIM_SECONDS:120}

# External integrations
app.integrations.credential-encryption-keys=${INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS:${WEBHOOK_SECRET_ENCRYPTION_KEYS}}
app.integrations.current-key-version=${INTEGRATION_CREDENTIAL_ENCRYPTION_KEY_VERSION:${WEBHOOK_SECRET_ENCRYPTION_KEY_VERSION:v1}}
app.integrations.whatsapp.base-url=${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
app.integrations.whatsapp.response-timeout-seconds=${WHATSAPP_RESPONSE_TIMEOUT_SECONDS:10}
app.integrations.worker.enabled=${INTEGRATION_WORKER_ENABLED:true}
app.integrations.worker.batch-size=${INTEGRATION_WORKER_BATCH_SIZE:10}
app.integrations.worker.poll-interval-ms=${INTEGRATION_WORKER_POLL_INTERVAL_MS:1000}
app.integrations.worker.initial-delay-ms=${INTEGRATION_WORKER_INITIAL_DELAY_MS:5000}
app.integrations.worker.stale-claim-seconds=${INTEGRATION_STALE_CLAIM_SECONDS:120}
app.integrations.worker.maximum-attempts=${INTEGRATION_MAXIMUM_ATTEMPTS:6}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

info.app.name=Enterprise CRM
info.app.version=1.0.0
info.app.description=CRM system backend
# Logging
logging.level.root=INFO
logging.level.com.crm.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.tenant.enforcement-enabled=${TENANT_ENFORCEMENT_ENABLED:true}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [requestId=%X{requestId:-none} organizationId=%X{organizationId:-none} userId=%X{userId:-none}] [%thread] %logger{36} - %msg%n
# Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

app.email.from-address=${MAIL_FROM_ADDRESS}
app.email.from-name=${MAIL_FROM_NAME:Tadamun}
app.email.reply-to=${MAIL_REPLY_TO}
# Attachments
spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_REQUEST_SIZE:11MB}

app.attachments.storage-path=${ATTACHMENT_STORAGE_PATH:./data/attachments}
app.attachments.max-size-bytes=${ATTACHMENT_MAX_SIZE_BYTES:10485760}
app.attachments.allowed-content-types=${ATTACHMENT_ALLOWED_CONTENT_TYPES:application/pdf,image/png,image/jpeg,text/plain,text/csv,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
# Business timezone
app.time-zone=${APP_TIME_ZONE:Africa/Mogadishu}

app.frontend.base-url=${APP_FRONTEND_BASE_URL}
app.email.enabled=${APP_EMAIL_ENABLED:false}

# Stripe billing
app.billing.stripe.enabled=${STRIPE_ENABLED:false}
app.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.stripe.starter-price-id=${STRIPE_PRICE_STARTER:}
app.billing.stripe.professional-price-id=${STRIPE_PRICE_PROFESSIONAL:}
app.billing.stripe.business-price-id=${STRIPE_PRICE_BUSINESS:}
app.billing.stripe.enterprise-price-id=${STRIPE_PRICE_ENTERPRISE:}
