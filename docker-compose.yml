services:
  mysql:
    image: mysql:8.4
    container_name: crm_mysql
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"

      
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - crm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30
    container_name: crm_mailpit
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "${MAILPIT_WEB_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  backend:
    build:
      context: ./backend
    container_name: crm_backend
    restart: unless-stopped
    mem_limit: 768m
    
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      PUBLIC_API_KEY_PEPPER: ${PUBLIC_API_KEY_PEPPER}
      WEBHOOK_SECRET_ENCRYPTION_KEYS: ${WEBHOOK_SECRET_ENCRYPTION_KEYS}
      WEBHOOK_SECRET_ENCRYPTION_KEY_VERSION: ${WEBHOOK_SECRET_ENCRYPTION_KEY_VERSION:-v1}
      WEBHOOK_ALLOW_LOCAL_HTTP: ${WEBHOOK_ALLOW_LOCAL_HTTP:-true}
      WEBHOOK_WORKER_ENABLED: ${WEBHOOK_WORKER_ENABLED:-true}
      WEBHOOK_WORKER_BATCH_SIZE: ${WEBHOOK_WORKER_BATCH_SIZE:-10}
      WEBHOOK_WORKER_POLL_INTERVAL_MS: ${WEBHOOK_WORKER_POLL_INTERVAL_MS:-1000}
      WEBHOOK_WORKER_INITIAL_DELAY_MS: ${WEBHOOK_WORKER_INITIAL_DELAY_MS:-5000}
      WEBHOOK_STALE_CLAIM_SECONDS: ${WEBHOOK_STALE_CLAIM_SECONDS:-120}
      WEBHOOK_EVENT_MAXIMUM_ATTEMPTS: ${WEBHOOK_EVENT_MAXIMUM_ATTEMPTS:-5}
      WEBHOOK_FAILED_SUBSCRIPTION_THRESHOLD: ${WEBHOOK_FAILED_SUBSCRIPTION_THRESHOLD:-10}
      WORKFLOW_WORKER_ENABLED: ${WORKFLOW_WORKER_ENABLED:-true}
      WORKFLOW_WORKER_BATCH_SIZE: ${WORKFLOW_WORKER_BATCH_SIZE:-10}
      WORKFLOW_WORKER_POLL_INTERVAL_MS: ${WORKFLOW_WORKER_POLL_INTERVAL_MS:-1000}
      WORKFLOW_WORKER_INITIAL_DELAY_MS: ${WORKFLOW_WORKER_INITIAL_DELAY_MS:-5000}
      WORKFLOW_STALE_CLAIM_SECONDS: ${WORKFLOW_STALE_CLAIM_SECONDS:-120}
      SERVER_PORT: ${SERVER_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TENANT_ENFORCEMENT_ENABLED: ${TENANT_ENFORCEMENT_ENABLED:-true}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED}
      ATTACHMENT_STORAGE_PATH: ${ATTACHMENT_STORAGE_PATH:-/data/attachments}
      ATTACHMENT_MAX_FILE_SIZE: ${ATTACHMENT_MAX_FILE_SIZE:-10MB}
      ATTACHMENT_MAX_REQUEST_SIZE: ${ATTACHMENT_MAX_REQUEST_SIZE:-11MB}
      ATTACHMENT_MAX_SIZE_BYTES: ${ATTACHMENT_MAX_SIZE_BYTES:-10485760}
      ATTACHMENT_ALLOWED_CONTENT_TYPES: ${ATTACHMENT_ALLOWED_CONTENT_TYPES:-application/pdf,image/png,image/jpeg,text/plain,text/csv,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Africa/Mogadishu}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED}
      
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS}
      MAIL_TIMEOUT_MS: ${MAIL_TIMEOUT_MS}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS}

    volumes:
      - crm_attachment_data:/data/attachments
      
    ports:
      - "${BACKEND_PORT}:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: crm_frontend
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"  

         

volumes:
  crm_mysql_data:
  crm_attachment_data:
